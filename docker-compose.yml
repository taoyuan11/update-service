services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      APP_BIND: ${APP_BIND:-0.0.0.0:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
    volumes:
      - application_files:/var/lib/update-service

  web:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  application_files:
