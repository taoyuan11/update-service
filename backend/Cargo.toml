[package]
name = "update-service-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "update-service"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
rand = "0.9"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }


[profile.dev]
# Debug info is expensive to generate and link on low-memory deployment hosts.
debug = 0

[profile.test]
debug = 0

[profile.release]
# Preserve optimized runtime code while allowing repeated production builds to
# reuse unchanged code-generation units from the Docker target cache.
incremental = true